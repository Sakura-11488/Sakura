# Sakura media ingest — add inside the existing :80 server block (same one that
# serves /psyopanime/). After editing: nginx -t && systemctl reload nginx
# deploy.sh inserts this automatically.

# Ingest API — proxied to the Node service. Large bodies allowed for video.
location /media/v1/ {
    proxy_pass          http://127.0.0.1:3200/v1/;
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    client_max_body_size 4g;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}

# Creator-uploaded video + posters (written by the ingest service).
# (If your nginx build has ngx_http_mp4_module — nginx-full/extras — add
# `mp4;` here for efficient seeking. Omitted by default: nginx-core lacks it
# and an unknown directive would fail `nginx -t`.)
location /creator-media/ {
    alias /var/www/creator-media/;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=86400";
}

# Generic Sakura Originals tree (degegen-files already lives here; new works
# land under /var/www/sakura-originals/<slug>/ automatically).
location /sakura-originals/ {
    alias /var/www/sakura-originals/;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=300";
}
