# Drop this into your existing nginx server block that listens on :80 for the
# Sakura droplet (the same block that already serves /psyopanime/ and
# /comics/v1/). After editing, run `nginx -t && systemctl reload nginx`.
#
# deploy.sh rewrites the marked block in place on every run, so edits here
# actually take effect on an already-deployed box. (They did not before: the old
# script skipped the patch whenever the marker was already present.)

# The operator probe is an arbitrary-path fetcher pointed at a bot-scored origin
# from our only IP — anyone who found it could have looped it until hentaifox
# hard-blocked the droplet. It is token-gated in the service too; this is the
# belt. Run it over SSH against 127.0.0.1:3101 instead.
location = /hentai/v1/debug/probe {
    deny all;
}

# Hentai scraper proxy — strips the /hentai/v1 prefix and forwards to the
# Node service on 127.0.0.1:3101.
location /hentai/v1/ {
    proxy_pass         http://127.0.0.1:3101/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Must exceed the service's worst-case retry budget or the app gets an
    # opaque 504 instead of our JSON error — and /healthz itself becomes
    # unreachable through nginx exactly when it is needed. Current budget is
    # ~16.8s (see HENTAI_REQUEST_TIMEOUT_MS in ecosystem.config.cjs); this is
    # deliberately well above it.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # CORS is already set by the Node service, but belt-and-braces in case we
    # ever swap backends.
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Headers *  always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
