# Drop this into your existing nginx server block that listens on :80 for the
# Sakura droplet (the same block that already serves /psyopanime/ and
# /comics/v1/). After editing, run `nginx -t && systemctl reload nginx`.

# Hentai scraper proxy — strips the /hentai/v1 prefix and forwards to the
# Node service on 127.0.0.1:3101.
location /hentai/v1/ {
    proxy_pass         http://127.0.0.1:3101/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # CORS is already set by the Node service, but belt-and-braces in case we
    # ever swap backends.
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Headers *  always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
