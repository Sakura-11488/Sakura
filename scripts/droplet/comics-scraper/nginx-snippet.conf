# Drop this into your existing nginx server block that listens on :80 for the
# Sakura droplet (the same block that already serves /psyopanime/ and
# /hentai/v1/). After editing, run `nginx -t && systemctl reload nginx`.
#
# deploy.sh rewrites the marked block in place on every run, so edits here
# actually take effect on an already-deployed box.

# The operator probe is an arbitrary-path fetcher pointed at the upstream from
# our only IP, and it used to be unauthenticated AND metered — anyone who found
# it could have looped it until the ZenRows account hit its quota wall. It is
# token-gated in the service too; this is the belt. Run it over SSH against
# 127.0.0.1:3100 instead.
location = /comics/v1/debug/probe {
    deny all;
}

# /readyz walks the whole read path: ~1.1 MB of upstream HTML plus several
# hundred ms of blocked single-threaded event loop per call. It is single-flight
# and cached in the service, but it has no business being reachable from the
# internet. deploy.sh polls 127.0.0.1:3100 directly.
location = /comics/v1/readyz {
    deny all;
}

# Comics scraper proxy — strips the /comics/v1 prefix and forwards to the
# Node service on 127.0.0.1:3100.
location /comics/v1/ {
    proxy_pass         http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # DELIBERATELY UNCHANGED AT 30s.
    #
    # This location lives inside the ONE shared server{} of a 1-worker nginx
    # (nproc = 1, worker_connections 768) that also serves /psyopanime/,
    # /sakura-originals/, /2heanime/, /mangadex/*, /manhwa/v1/, /media/v1/,
    # /creator-media/ and /hentai/v1/. A proxied request holds two connection
    # slots for the whole read timeout, so raising this to 120s would drop the
    # comics arrival rate that exhausts nginx BOX-WIDE from ~12.8 req/s to
    # ~3.2 req/s. A comics incident would take every other service with it.
    #
    # The fix is on the service side, not here: COMICS_TOTAL_BUDGET_MS caps the
    # whole ladder at 25s (direct 8s; proxy 2 attempts x 9s + 0.6s backoff),
    # which fits under this with room to spare. See ecosystem.config.cjs.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # CORS is already set by the Node service, but belt-and-braces in case we
    # ever swap backends.
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Headers *  always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
